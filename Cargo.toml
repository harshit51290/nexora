[package]
name = "nexora"
version = "0.1.0"
edition = "2021"
description = "Universal local AI runtime manager (scaffold slices: RUST CORE orchestration + API + CLI + jobs; core wiring pending)"
license = "MIT"

[lib]
name = "nexora"
path = "src/lib.rs"

[[bin]]
name = "nexora"
path = "src/main.rs"

[[bin]]
name = "uar"
path = "src/cli/main.rs"

[dependencies]
# --- RUST CORE slice (orchestration) ---
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tauri = { version = "2" }
sysinfo = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
dirs = "5"
sha2 = "0.10"
semver = "1"
# --- API + CLI + jobs slice ---
chrono = "0.4"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
