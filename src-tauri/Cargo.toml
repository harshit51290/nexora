[package]
name = "nexora-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same core the REST/CLI layers use (TAURI-NEED: unblocks replacing the
# E_CORE_NOT_WIRED stub bodies in src/main.rs with real manager calls).
nexora = { path = ".." }
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
